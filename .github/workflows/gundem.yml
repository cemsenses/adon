name: Gündem deploy

on:
  push:
    branches: [main]
    paths: ['gundem-worker/**', '.github/workflows/gundem.yml']
  workflow_dispatch:

concurrency:
  group: gundem
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gundem-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: D1 veritabanını bul veya oluştur
        run: |
          ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s).find(d=>d.name==="adon-gundem");console.log(x?x.uuid:"")})')
          if [ -z "$ID" ]; then
            npx wrangler d1 create adon-gundem >/dev/null
            ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{console.log(JSON.parse(s).find(d=>d.name==="adon-gundem").uuid)})')
          fi
          sed -i "s/REPLACE_WITH_D1_ID/$ID/" wrangler.toml
          echo "D1: $ID"

      - name: R2 bucket'ı oluştur (varsa geç)
        run: npx wrangler r2 bucket create adon-gundem-images || true

      - name: Şemayı uygula
        run: npx wrangler d1 execute adon-gundem --remote --yes --file=schema.sql

      - name: Worker'ı deploy et
        run: npx wrangler deploy

      - name: İçeriği senkronize et
        run: node sync-content.mjs
