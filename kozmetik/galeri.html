<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADON Studio — Galeri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@200;300;400;500;600&family=Lexend+Deca:wght@100;200;300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    background: #000;
    color: #f5f5f3;
    font-family: 'Lexend', sans-serif;
  }
  body {
    min-height: 100vh;
    padding: 6vh 4vw 8vh;
  }

  .gallery-header {
    text-align: left;
    margin-bottom: 5vh;
    opacity: 0;
    transform: translateY(15px);
    animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  .gallery-eyebrow {
    font-family: 'Lexend Deca', sans-serif;
    font-weight: 100;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 1.5vh;
  }
  .gallery-title {
    font-weight: 200;
    font-size: clamp(24px, 3.2vw, 44px);
    letter-spacing: -0.02em;
  }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 1fr;
    gap: 10px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .thumb {
    position: relative;
    aspect-ratio: 2 / 3;
    overflow: hidden;
    background: #0a0a0a;
    cursor: pointer;
    opacity: 0;
    transform: translateY(25px) scale(0.97);
    animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  .thumb img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s cubic-bezier(0.16,1,0.3,1), filter 0.6s ease;
    filter: grayscale(15%) brightness(0.92);
  }
  .thumb:hover img {
    transform: scale(1.05);
    filter: grayscale(0%) brightness(1);
  }
  .thumb::after {
    content: '';
    position: absolute;
    inset: 0;
    border: 1px solid rgba(245,245,243,0.08);
    pointer-events: none;
    transition: border-color 0.4s ease;
  }
  .thumb:hover::after {
    border-color: rgba(245,245,243,0.3);
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: none; }
  }

  /* LIGHTBOX */
  #lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.94);
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    padding: 4vh 4vw;
  }
  #lightbox.open {
    opacity: 1;
    pointer-events: auto;
  }
  #lightbox img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    transform: scale(0.94);
    transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
  }
  #lightbox.open img {
    transform: scale(1);
  }
  #lightbox-close {
    position: fixed;
    top: 3.5vh;
    right: 3.5vw;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 1px solid rgba(245,245,243,0.25);
    border-radius: 50%;
    cursor: pointer;
    transition: border-color 0.3s ease, background 0.3s ease;
    z-index: 2001;
  }
  #lightbox-close:hover {
    border-color: rgba(245,245,243,0.8);
    background: rgba(245,245,243,0.06);
  }
  #lightbox-close svg {
    width: 16px;
    height: 16px;
    stroke: #f5f5f3;
    stroke-width: 1.4;
  }

  @media (max-width: 900px) {
    .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    body { padding: 5vh 5vw 6vh; }
    #lightbox-close { top: 2.5vh; right: 4vw; width: 38px; height: 38px; }
  }
</style>
</head>
<body>

  <div class="gallery-header">
    <p class="gallery-eyebrow">ADON Studio</p>
    <h1 class="gallery-title">Galeri</h1>
  </div>

  <div class="gallery-grid" id="gallery-grid"></div>

  <div id="lightbox">
    <img id="lightbox-img" src="" alt="">
  </div>
  <button id="lightbox-close" aria-label="Kapat">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="4" y1="4" x2="20" y2="20" stroke-linecap="round"/>
      <line x1="20" y1="4" x2="4" y2="20" stroke-linecap="round"/>
    </svg>
  </button>

<script>
  var allImages = [
    "adp-1.png","adp-2.png","adp-3.png","adp-4.png",
    "el-1.jpeg","el-2.jpeg","el-3.png","el-4.png",
    "imp-1.png","imp-2.jpg","imp-3.jpg","imp-4.png",
    "ps-1.png","ps-2.jpg","ps-3.jpg","ps-4.jpg",
    "ro-1.png","ro-2.png","ro-3.jpg","ro-4.png","ro-5.jpg","ro-6.jpeg","ro-7.jpeg","ro-8.png",
    "rs-1.png","rs-2.png","rs-3.jpg","rs-4.png","rs-5.jpg","rs-6.jpeg","rs-7.jpeg","rs-8.png",
    "uc-1.png","uc-2.png","uc-3.png","uc-4.png"
  ];

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  var selected = shuffle(allImages).slice(0, 12);
  var grid = document.getElementById('gallery-grid');

  selected.forEach(function(src, i) {
    var thumb = document.createElement('div');
    thumb.className = 'thumb';
    thumb.style.animationDelay = (i * 0.05) + 's';
    var img = document.createElement('img');
    img.src = src;
    img.alt = 'ADON Studio';
    img.loading = 'lazy';
    thumb.appendChild(img);
    thumb.addEventListener('click', function(){
      openLightbox(src);
    });
    grid.appendChild(thumb);
  });

  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightbox-img');
  var closeBtn = document.getElementById('lightbox-close');

  function openLightbox(src) {
    lightboxImg.src = src;
    lightbox.classList.add('open');
  }
  function closeLightbox() {
    lightbox.classList.remove('open');
  }

  closeBtn.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', function(e){
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeLightbox();
  });
</script>
</body>
</html>
